services:
  web:
    build: .
    command: gunicorn config.wsgi --bind 0.0.0.0:8000
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/app:ro
    depends_on:
      - web
      - frontend

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
